{% load static %}

<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="shortcut icon" href="{% static 'yasha/img/favicon.ico' %}" type="image/x-icon" />   
  <link rel="apple-touch-icon" href="{% static 'yasha/img/favicon-apple-touch-icon.ico' %}" />

  <title>Yasha Dent</title>

  <link rel="stylesheet" href="{% static 'yasha/css/maicons.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/owl-carousel/css/owl.carousel.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/animate/animate.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/theme.css' %}">
</head>

<body>

  <!-- Back to top button -->
  <div class="back-to-top"></div>

  <header id="site-header">
  </header>

  <div class="page-banner overlay-dark bg-image" id="image-partners">
    <div class="banner-section">
      <div class="container text-center wow fadeInUp">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb breadcrumb-dark bg-transparent justify-content-center py-0 mb-2">
            <li class="breadcrumb-item"><a href="/">صفحه اصلی</a></li>
            <li class="breadcrumb-item active" aria-current="page">بیمه ها و شرکا</li>
          </ol>
        </nav>
        <h1 class="font-weight-normal">بیمه ها و شرکا</h1>
      </div> <!-- .container -->
    </div> <!-- .banner-section -->
  </div> <!-- .page-banner -->

  

  <div class="page-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 wow fadeInUp" style="direction: rtl; text-align: right;">
          <h1 class="text-center mb-1">کلینیک یاشا با همکاری بیمه های نامبرده سعی در ارایه بهتر خدمات را دارد.</h1>
        </div>        
        <div class="col-lg-10 mt-5">          
          <div class="page-section bg-light">
            <div class="container">
              <div class="row">

                {% for insurance in results %} 
                <div class="col-md-4 py-3 wow zoomIn">
                  <div class="row card-insurance">  
                    <div class="col-sm-6" style="text-align: left;">
                      <img src={{insurance.image}} alt="">                
                    </div>
                    <div class="col-sm-6 insurance-name">
                      <p style="text-align: right;"><span>{{insurance.name_fa}}</p>  
                    </div>                                                      
                  </div>
                </div>                                                         
                {% endfor %}

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
 
  <footer class="page-footer" id="site-footer">
  </footer>

  <script src="{% static 'yasha/js/jquery-3.5.1.min.js' %}"></script>   
  <script src="{% static 'yasha/js/bootstrap.bundle.min.js' %}"></script> 
  <script src="{% static 'yasha/vendor/owl-carousel/js/owl.carousel.min.js' %}"></script> 
  <script src="{% static 'yasha/vendor/wow/wow.min.js' %}"></script> 
  <script src="{% static 'yasha/js/theme.js' %}"></script>
  <script type="module" src="{% static 'yasha/js/switchpage.js' %}"></script> 
  <script type="module" src="{% static 'yasha/js/showdata.js' %}"></script> 
  
</body>
</html>

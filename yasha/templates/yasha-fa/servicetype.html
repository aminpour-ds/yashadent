{% load static %}

<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="shortcut icon" href="{% static 'yasha/img/favicon.ico' %}" type="image/x-icon" />   
  <link rel="apple-touch-icon" href="{% static 'yasha/img/favicon-apple-touch-icon.ico' %}" />

  <title>Yasha Dent</title>

  <link rel="stylesheet" href="{% static 'yasha/css/maicons.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/owl-carousel/css/owl.carousel.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/animate/animate.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/theme.css' %}">
</head>

<body>

  <!-- Back to top button -->
  <div class="back-to-top"></div>

  <header id="site-header">
  </header>
  
  <div class="page-banner overlay-dark bg-image" id="image-service">
    <div class="banner-section">
      <div class="container text-center wow fadeInUp">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb breadcrumb-dark bg-transparent justify-content-center py-0 mb-2">
            <li class="breadcrumb-item"><a href="/">صفحه اصلی</a></li>
            <li class="breadcrumb-item active" aria-current="page">خدمات</li>
          </ol>
        </nav>
        <h1 class="font-weight-normal">خدمات</h1>
      </div> <!-- .container -->
    </div> <!-- .banner-section -->
  </div> <!-- .page-banner -->
  
  <div class="page-section pt-5">
    <div class="container">
      <div class="row">
        <div class="col-lg-8">
          <article class="blog-details">
            <div class="post-thumb">
              <img src={{service_detail.images.0.image}} alt="">             
            </div>
            <div class="post-meta">
              <div class="post-author">
                <span class="text-grey">By Admin</span>  
              </div>
              <span class="divider">|</span>
              <div class="post-date">
                <a>{{service_detail.last_update}}</a>              
              </div>              
            </div>
            <h2 class="post-title h1" style="direction: rtl; text-align: right;">{{service_detail.name_fa}}</h2>
            <div class="post-content" style="direction: rtl; text-align: right;">                                
              <p>{{service_detail.description_fa}}</p>                           
            </div>                        

          </article> <!-- .blog-details -->
         
        </div>
        <div class="col-lg-4">
          <div class="sidebar" style="direction: rtl; text-align: right;">            
            <div class="sidebar-block">
              <h3 class="sidebar-title">خدمات</h3>              
              
              {% for srv in results %} 
              <div class="blog-item">
                <a class="post-thumb post-thumb-fa" href="/service/{{srv.id}}">
                  <img src={{srv.images.0.image}} alt="">
                </a>
                <div class="content post-info-fa">
                  <h5 class="post-title"><a href="/service/{{srv.id}}">{{srv.name_fa}}</a></h5>
                  <div class="meta">
                    <a>Admin <span class="mai-person"></span></a>                   
                    <a>{{srv.last_update}} <span class="mai-calendar"></span></a>
                  </div>
                </div>
              </div>
              {% endfor %}

            </div>            
          </div>
        </div> 
      </div> <!-- .row -->
    </div> <!-- .container -->
  </div> <!-- .page-section -->

  <footer class="page-footer" id="site-footer">
  </footer>


  <script src="{% static 'yasha/js/jquery-3.5.1.min.js' %}"></script>   
  <script src="{% static 'yasha/js/bootstrap.bundle.min.js' %}"></script> 
  <script src="{% static 'yasha/vendor/owl-carousel/js/owl.carousel.min.js' %}"></script> 
  <script src="{% static 'yasha/vendor/wow/wow.min.js' %}"></script> 
  <script src="{% static 'yasha/js/theme.js' %}"></script>
  <script type="module" src="{% static 'yasha/js/switchpage.js' %}"></script> 
  <script type="module" src="{% static 'yasha/js/showdata.js' %}"></script> 

</body>
</html>

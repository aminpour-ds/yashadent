{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Site Icons -->
  <link rel="shortcut icon" href="{% static 'yasha/img/favicon.ico' %}" type="image/x-icon" />   
  <link rel="apple-touch-icon" href="{% static 'yasha/img/favicon-apple-touch-icon-75.ico' %}" />

  <title>Yasha Dent</title>

  <link rel="stylesheet" href="{% static 'yasha/css/maicons.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/owl-carousel/css/owl.carousel.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/animate/animate.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/theme.css' %}">

</head>
<body>

  <!-- Back to top button -->
  <div class="back-to-top"></div>

  <header id="site-header">
  </header>

  <div class="page-banner overlay-dark bg-image" style="background-image: url(../assets/img/bg_image_1.jpg);">
    <div class="banner-section">
      <div class="container text-center wow fadeInUp">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb breadcrumb-dark bg-transparent justify-content-center py-0 mb-2">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Doctors</li>
          </ol>
        </nav>
        <h1 class="font-weight-normal">Our Doctors</h1>
      </div> <!-- .container -->
    </div> <!-- .banner-section -->
  </div> <!-- .page-banner -->

  <div class="page-section bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">

          <div class="row">
            
            {% for doctor in results %} 
    
            <div class="col-md-6 col-lg-4 py-3 wow zoomIn">
              <div class="card-doctor">
                <div class="header">
                  <img src={{doctor.images.0.image}} alt="">
                  <div class="meta">
                    <a href="#"><span class="mai-call"></span></a>
                    <a href="#"><span class="mai-logo-whatsapp"></span></a>
                  </div>
                </div>
                <div class="body">
                  <p class="text-xl mb-0">Dr. {{doctor.first_name}} {{doctor.last_name}}</p>
                  <span class="text-sm text-grey">{{doctor.professionalStatement}}</span>
                </div>
              </div>
            </div>
            {% endfor %}        

          </div>

        </div>
      </div>
    </div> <!-- .container -->
  </div> <!-- .page-section -->

  <div class="page-section">
    <div class="container">
      <h1 class="text-center wow fadeInUp">Make an Appointment</h1>

      <form class="main-form">
        <div class="row mt-5 ">
          <div class="col-12 col-sm-6 py-2 wow fadeInLeft">
            <input type="text" class="form-control" placeholder="Full name">
          </div>
          <div class="col-12 col-sm-6 py-2 wow fadeInRight">
            <input type="text" class="form-control" placeholder="Email address..">
          </div>
          <div class="col-12 col-sm-6 py-2 wow fadeInLeft" data-wow-delay="300ms">
            <input type="date" class="form-control">
          </div>
          <div class="col-12 col-sm-6 py-2 wow fadeInRight" data-wow-delay="300ms">
            <select name="departement" id="departement" class="custom-select">
              <option value="general">General Health</option>
              <option value="cardiology">Cardiology</option>
              <option value="dental">Dental</option>
              <option value="neurology">Neurology</option>
              <option value="orthopaedics">Orthopaedics</option>
            </select>
          </div>
          <div class="col-12 py-2 wow fadeInUp" data-wow-delay="300ms">
            <input type="text" class="form-control" placeholder="Number..">
          </div>
          <div class="col-12 py-2 wow fadeInUp" data-wow-delay="300ms">
            <textarea name="message" id="message" class="form-control" rows="6" placeholder="Enter message.."></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3 wow zoomIn">Submit Request</button>
      </form>
    </div> <!-- .container -->
  </div> <!-- .page-section -->
  
  <footer class="page-footer" id="site-footer">
  </footer>

  
  
  <!-- <input type="hidden" id="STATICFILES-DIRS" name="DIRS" value={{STATICFILES_DIRS}}> -->
  <!-- <script type="text/javascript">var DJANGO_STATIC_URL = '{{ STATICFILES_DIRS }}';</script> -->
<script src="{% static 'yasha/js/showdata.js' %}"></script> 
<script src="{% static 'yasha/js/jquery-3.5.1.min.js' %}"></script>   
<script src="{% static 'yasha/js/bootstrap.bundle.min.js' %}"></script> 
<script src="{% static 'yasha/vendor/owl-carousel/js/owl.carousel.min.js' %}"></script> 
<script src="{% static 'yasha/vendor/wow/wow.min.js' %}"></script> 
<script src="{% static 'yasha/js/theme.js' %}"></script>
  
</body>
</html>

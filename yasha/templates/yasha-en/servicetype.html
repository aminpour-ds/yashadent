{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Site Icons -->
  <link rel="shortcut icon" href="{% static 'yasha/img/favicon.ico' %}" type="image/x-icon" />   
  <link rel="apple-touch-icon" href="{% static 'yasha/img/favicon-apple-touch-icon-75.ico' %}" />

  <title>Yasha Dent</title>

  <link rel="stylesheet" href="{% static 'yasha/css/maicons.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/owl-carousel/css/owl.carousel.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/vendor/animate/animate.css' %}">
  <link rel="stylesheet" href="{% static 'yasha/css/theme.css' %}">

</head>
<body>

  <!-- Back to top button -->
  <div class="back-to-top"></div>

  <header id="site-header">
  </header>
  
  <div class="page-banner overlay-dark bg-image" style="background-image: url(../assets/img/bg_image_1.jpg);">
    <div class="banner-section">
      <div class="container text-center wow fadeInUp">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb breadcrumb-dark bg-transparent justify-content-center py-0 mb-2">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Our Services</li>
          </ol>
        </nav>
        <h1 class="font-weight-normal">Services</h1>
      </div> <!-- .container -->
    </div> <!-- .banner-section -->
  </div> <!-- .page-banner -->
  
  <div class="page-section pt-5">
    <div class="container">

      <div class="row">
        <div class="col-lg-8">
          <article class="blog-details">
            <div class="post-thumb">
              <img src={{results.0.images.0.image}} alt="">             
            </div>
            <div class="post-meta">
              <div class="post-author">
                <span class="text-grey">By</span> <a href="#">Admin</a>  
              </div>
              <span class="divider">|</span>
              <div class="post-date">
                <a href="#">{{results.0.last_update}}</a>
              
              </div>
              
            </div>
            <h2 class="post-title h1">{{results.0.name}}</h2>
            <div class="post-content">
              <p>{{results.0.description}}</p>                           
            </div>                        

          </article> <!-- .blog-details -->
         
        </div>
        <div class="col-lg-4">
          <div class="sidebar">            
            <div class="sidebar-block">
              <h3 class="sidebar-title">Services</h3>              
              
              {% for srv in results %} 
              <div class="blog-item">
                <a class="post-thumb" href="/service/{{srv.id}}">
                  <img src={{srv.images.0.image}} alt="">
                </a>
                <div class="content">
                  <h5 class="post-title"><a href="/service/{{srv.id}}">{{srv.name}}</a></h5>
                  <div class="meta">
                    <a href="#"><span class="mai-calendar"></span> {{srv.last_update}}</a>
                    <a href="#"><span class="mai-person"></span> Admin</a>                   
                  </div>
                </div>
              </div>
              {% endfor %}

            </div>            
          </div>
        </div> 
      </div> <!-- .row -->
    </div> <!-- .container -->
  </div> <!-- .page-section -->

  <footer class="page-footer" id="site-footer">
  </footer>


  <script src="{% static 'yasha/js/showdata.js' %}"></script> 
  <script src="{% static 'yasha/js/jquery-3.5.1.min.js' %}"></script>   
  <script src="{% static 'yasha/js/bootstrap.bundle.min.js' %}"></script> 
  <script src="{% static 'yasha/vendor/owl-carousel/js/owl.carousel.min.js' %}"></script> 
  <script src="{% static 'yasha/vendor/wow/wow.min.js' %}"></script> 
  <script src="{% static 'yasha/js/theme.js' %}"></script>

</body>
</html>
